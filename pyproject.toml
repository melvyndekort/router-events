[project]
name = "router-events"
version = "0.1.0"
description = "RouterOS event receiver and processor"
authors = [{name = "Melvyn de Kort", email = "melvyn@mdekort.nl"}]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.38",
    "pydantic>=2.13.0",
    "aiomysql>=0.3",
    "httpx>=0.28",
    "sqlalchemy>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.2",
    "pylint>=3.3.9",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["router_events"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
